name: Deploy CT110 harness

# TASK 224 / disconnect checklist D5: replace the PTAIT09-pushed deploy
# (C:/tmp/optimistic_deploy_harness.py streaming deploy-harness-v2.sh into
# `pct exec 110` over ssh) with a CI-owned, manually dispatched deploy that
# runs entirely on the LAN runner (CT210, label `lan-deploy`).  Once PTAIT09
# is disconnected this workflow is the ONLY way CT110 gets upgraded.
#
# Paid-for lessons from the old script that this workflow preserves (do not
# remove the guards that encode them — see scripts/deploy/ct110/README.md):
#   1. The deploy script travels as BYTES end to end.  A text pipe added
#      CRLFs on 2026-09-18 and bash died with `$'do\r'`; we scp (binary
#      protocol) + pct push and sha256-verify every hop instead.
#   2. Exit code 2 is OVERLOADED: the inner script's own idle-recheck abort
#      AND a bash syntax error both surface as rc=2.  The runner-side wrapper
#      (scripts/deploy/ct110/run_on_ct110.sh) prints captured stderr BEFORE
#      interpreting any nonzero rc.
#   3. The deploy RESTARTS lh-harness.service and kills every in-flight run.
#      We wait for a counted zero-active window (GET /api/runs) before
#      touching the host, and the inner script re-checks idleness itself.
#      TASK 242: with a backlog the three kimi slots refill the moment one
#      frees, so a plain zero-active wait may never fire.  The deploy now
#      first sets the queue drain flag (POST /api/queue/drain) so NO new
#      launches happen while live runs finish, waits for the zero-active
#      window, deploys, verifies, and clears the drain.  The flag persists
#      across the restart, so a failed verify leaves CT110 drained (new
#      launches still blocked) rather than silently refilling the slots;
#      clearing it is an explicit, verified step.
#   4. A DEPLOY-HOLD hold file aborts the deploy so a known-bad main cannot
#      ship (09-18 mechanism; path candidates in ct110_deploy.sh).
#   5. A zero-active WAIT can also take forever when the live runs are long,
#      so since fc-H4b the default is to STOP them instead
#      (active_runs=suspend): with the drain set, POST
#      /api/maintenance/suspend parks every ACTIVE run in a persisted
#      manifest, a short zero-active wait (10 minutes, only for the stops to
#      land) confirms idleness, and after the deploy verifies, POST
#      /api/maintenance/resume puts every parked run back (mode=continue)
#      BEFORE the drain clears — on the success path and on the
#      automatically-rolled-back path alike, so a suspended run is never
#      left behind.  active_runs=wait is exactly the lesson-3 behaviour.
#      Cost (scripts/deploy/ct110/README.md): a suspended run's round in
#      progress is redone after resume.
#
# NEVER auto-triggered: the only trigger is workflow_dispatch, so a push to
# main ships nothing by itself.
#
# Prerequisites owned by a human (the values cannot live in git):
#   - A self-hosted runner registered FOR THIS REPO with label `lan-deploy`
#     (template lesson 2026-09-06: every repo with a lan-deploy job needs its
#     own runner registration on CT210, user `runner`).
#   - GitHub environment `ct110-prod` with secrets (referenced only by name):
#       CT110_API_TOKEN   — bearer token for the CT110 web API
#       CT110_PVE_SSH_KEY — ed25519 private key allowed to ssh to the PVE host
#     and optional environment variables (defaults below match today's LAN):
#       CT110_WEB_URL, CT110_PVE_HOST, CT110_PVE_SSH_USER, CT110_CT_ID
#
# TARGETS (inventory: scripts/deploy/nodes.json; new-node runbook:
# scripts/deploy/node/README.md).  The `target` input picks the node; it
# defaults to ct110, and every per-target expression below falls back to the
# CT110 value for anything that is not exactly 'ct111', so a dispatch without
# `target` is the pre-existing CT110 deploy, unchanged.  For ct111 the
# GitHub environment is `ct111-prod` with secrets CT111_API_TOKEN /
# CT111_PVE_SSH_KEY and variables CT111_WEB_URL (REQUIRED, no default) and
# optional CT111_PVE_HOST / CT111_PVE_SSH_USER / CT111_CT_ID (default 111).
# Secrets and variables are selected by NAME with
# `secrets[format('{0}_API_TOKEN', <CT110|CT111>)]`: the name is built from a
# literal prefix, so there is no `a && secrets.X || secrets.Y` fall-through
# that could hand one node's credential to the other when a secret is unset.
# The job-level env names (CT110_API_TOKEN, CT110_WEB_URL, ...) and the
# CT110_* log markers are kept as-is for both targets: the helper scripts
# under scripts/deploy/ct110/ read those exact names.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Node to deploy (scripts/deploy/nodes.json)"
        required: true
        default: ct110
        type: choice
        options:
          - ct110
          - ct111
      target_ref:
        description: "Tag (vX.Y.Z) or full commit sha to deploy to the target node"
        required: true
        type: string
      wait_timeout_minutes:
        description: "Max minutes to wait for a zero-active-run window"
        required: true
        default: "30"
        type: string
      dry_run:
        description: "Preflight + build only; never touches the target node"
        required: true
        default: false
        type: boolean
      active_runs:
        description: "ACTIVE runs during the deploy: 'suspend' stops and resumes them around it (default, fc-H4b), 'wait' waits for a zero-active window"
        required: true
        default: suspend
        type: choice
        options:
          - suspend
          - wait

permissions:
  contents: read
  checks: read
  statuses: read

# One deploy at a time, and never cancel one mid-restart: a cancelled deploy
# can leave the service down or half-upgraded with no rollback pass.
# The group is per target (deploy-ct110 / deploy-ct111): the nodes are
# independent services, so one node's deploy never queues behind the other's.
concurrency:
  group: deploy-${{ inputs.target == 'ct111' && 'ct111' || 'ct110' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (ref resolves, tag==version, main green)
    runs-on: [self-hosted, lan-deploy]
    outputs:
      sha: ${{ steps.preflight.outputs.sha }}
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ref and gate on main CI
        id: preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: python3 scripts/deploy/ct110/preflight.py

  build:
    name: Build deployable wheel (with Web bundle)
    needs: preflight
    runs-on: [self-hosted, lan-deploy]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0

      # setup-python has no builds for the runner's Debian 12; uv fetches a
      # standalone Python and puts it (in a venv) on PATH for later steps.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Web dependencies
        run: npm ci --prefix frontend/web --no-audit --no-fund

      - name: Build Web frontend
        # The bundle is git-ignored; hatchling only packs it via `artifacts`
        # when it exists in the source tree (see pyproject.toml), so a wheel
        # built without this step would silently ship NO Web UI.
        run: npm run build --prefix frontend/web

      - name: Verify the Web bundle was produced
        run: test -f src/lh_harness/_frontend/web/dist/index.html

      # Every build is the same pyproject version, so the version cannot tell
      # two deploys apart (b6f51f9 / run 37162090599).  Stamp the commit into
      # the package; GET /api/meta reports it as meta.build.commit and the
      # deploy verifies the RESTARTED service runs exactly this commit.
      - name: Stamp the build commit into the package
        env:
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ "$head" != "$EXPECTED_COMMIT" ]; then
            echo "::error::checkout is $head, preflight resolved $EXPECTED_COMMIT"
            exit 1
          fi
          printf '{"commit": "%s"}\n' "$EXPECTED_COMMIT" > src/lh_harness/_build_info.json
          cat src/lh_harness/_build_info.json

      - name: Build wheel
        run: |
          uv build --wheel

      - name: Verify wheel version and build commit match preflight expectation
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          wheel="$(ls dist/lh_harness-*-py3-none-any.whl)"
          echo "wheel: $wheel"
          case "$(basename "$wheel")" in
            "lh_harness-${EXPECTED_VERSION}-"*) ;;
            *) echo "::error::wheel version does not match expected $EXPECTED_VERSION"; exit 1 ;;
          esac
          python - "$wheel" "$EXPECTED_COMMIT" <<'PY'
          import json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = zf.namelist()
              assert any(n.endswith("_frontend/web/dist/index.html") for n in names), \
                  "wheel is missing the Web bundle"
              assert "lh_harness/_build_info.json" in names, "wheel is missing _build_info.json"
              commit = json.loads(zf.read("lh_harness/_build_info.json")).get("commit")
          assert commit == sys.argv[2], f"wheel build commit {commit!r} != {sys.argv[2]!r}"
          print(f"wheel carries the Web bundle and build commit {commit}")
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target == 'ct111' && 'ct111' || 'ct110' }}-wheel
          path: dist/lh_harness-*-py3-none-any.whl
          retention-days: 30

  deploy:
    name: Deploy to ${{ inputs.target == 'ct111' && 'CT111' || 'CT110' }} (zero-active window, bytes-safe, verified)
    needs: [preflight, build]
    runs-on: [self-hosted, lan-deploy]
    environment: ${{ inputs.target == 'ct111' && 'ct111-prod' || 'ct110-prod' }}
    # Must exceed the longest wait_timeout_minutes (90) plus push/restart/verify, or GitHub
    # kills the job mid-wait (run 36827575382 died at exactly 1h30m).
    timeout-minutes: 150
    env:
      TARGET_NODE: ${{ inputs.target == 'ct111' && 'ct111' || 'ct110' }}
      EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
      # The commit the restarted service must report (meta.build.commit): the
      # version alone cannot tell builds apart.
      EXPECTED_COMMIT: ${{ needs.preflight.outputs.sha }}
      # Secret NAME = <CT110|CT111>_API_TOKEN / _PVE_SSH_KEY (see TARGETS in
      # the header).  For ct110 these are exactly secrets.CT110_API_TOKEN and
      # secrets.CT110_PVE_SSH_KEY, as before.
      CT110_API_TOKEN: ${{ secrets[format('{0}_API_TOKEN', inputs.target == 'ct111' && 'CT111' || 'CT110')] }}
      CT110_PVE_SSH_KEY: ${{ secrets[format('{0}_PVE_SSH_KEY', inputs.target == 'ct111' && 'CT111' || 'CT110')] }}
      WAIT_TIMEOUT_MINUTES: ${{ inputs.wait_timeout_minutes }}
      # Connection facts are environment VARS (non-secret) with LAN defaults;
      # they are resolved here, at the job that owns the environment.  The
      # CT110 web URL keeps its LAN default; ct111 has NO default URL (its IP
      # is assigned per install) and resolves to '' when CT111_WEB_URL is
      # unset — the "Require target configuration" step then fails the run.
      CT110_WEB_URL: ${{ vars[format('{0}_WEB_URL', inputs.target == 'ct111' && 'CT111' || 'CT110')] || (inputs.target != 'ct111' && 'http://192.168.21.168:8799' || '') }}
      PVE_HOST: ${{ vars[format('{0}_PVE_HOST', inputs.target == 'ct111' && 'CT111' || 'CT110')] || 'corsairai300' }}
      PVE_USER: ${{ vars[format('{0}_PVE_SSH_USER', inputs.target == 'ct111' && 'CT111' || 'CT110')] || 'root' }}
      CT_ID: ${{ vars[format('{0}_CT_ID', inputs.target == 'ct111' && 'CT111' || 'CT110')] || (inputs.target == 'ct111' && '111' || '110') }}
    steps:
      - uses: actions/checkout@v4

      # ct111 only (skipped for ct110, whose behaviour must not change): a new
      # node has no safe defaults, so refuse to continue — before anything is
      # downloaded, drained or pushed — when its URL or a secret is missing.
      # Runs on dry_run too: a dry run is how the environment gets validated.
      # Values are never printed, only which NAME is missing.
      - name: Require target configuration (ct111 has no defaults)
        if: ${{ inputs.target == 'ct111' }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "$CT110_WEB_URL" ]     || { echo "::error::variable CT111_WEB_URL is not set in environment ct111-prod (no default: the node's IP is assigned per install)"; missing=1; }
          [ -n "$CT110_API_TOKEN" ]   || { echo "::error::secret CT111_API_TOKEN is not set in environment ct111-prod"; missing=1; }
          [ -n "$CT110_PVE_SSH_KEY" ] || { echo "::error::secret CT111_PVE_SSH_KEY is not set in environment ct111-prod"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "target=$TARGET_NODE ct_id=$CT_ID pve_host=$PVE_HOST web_url=$CT110_WEB_URL"

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.target == 'ct111' && 'ct111' || 'ct110' }}-wheel
          path: stage

      - name: Stage SSH key
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/ct110_pve_key"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$CT110_PVE_SSH_KEY" > "$key_file"
          echo "SSH_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Set drain (stop new queue launches, task 242)
        id: set_drain
        if: ${{ !inputs.dry_run }}
        run: |
          python3 scripts/deploy/ct110/set_drain.py \
            --url "$CT110_WEB_URL" \
            --enable \
            --reason "deploy $EXPECTED_VERSION (${{ needs.preflight.outputs.sha }}) maintenance window" \
            --verify-state enabled

      - name: Suspend active runs (fc-H4b)
        id: suspend_runs
        if: ${{ !inputs.dry_run && inputs.active_runs == 'suspend' }}
        run: |
          # Async flow (LHH-SUSPEND-TIMEOUT): with the drain set and the
          # launch pause raised by the API (no new launches from this
          # instant), POST /api/maintenance/suspend returns 202 at once
          # with a suspend id; the script polls GET .../suspend/{id} on a
          # bounded budget until every active run is parked in a manifest
          # keyed to that id, and exports the id ($GITHUB_OUTPUT) so the
          # resume step below targets exactly THIS suspend's manifest.
          python3 scripts/deploy/ct110/suspend_runs.py \
            --url "$CT110_WEB_URL" \
            --reason "deploy $EXPECTED_VERSION (${{ needs.preflight.outputs.sha }}) maintenance window"

      - name: Wait for the suspended runs to stop (fc-H4b)
        if: ${{ !inputs.dry_run && inputs.active_runs == 'suspend' }}
        run: |
          # The stop signals above land asynchronously; this wait only has
          # to outlive THEM (the drain already blocks replacements), so the
          # timeout is a fixed 10 minutes, not WAIT_TIMEOUT_MINUTES.
          python3 scripts/deploy/ct110/wait_zero_active.py \
            --url "$CT110_WEB_URL" \
            --consecutive 3 \
            --interval-seconds 15 \
            --timeout-minutes 10

      - name: Wait for a counted zero-active window (GET /api/runs)
        if: ${{ !inputs.dry_run && inputs.active_runs == 'wait' }}
        run: |
          python3 scripts/deploy/ct110/wait_zero_active.py \
            --url "$CT110_WEB_URL" \
            --consecutive 3 \
            --interval-seconds 15 \
            --timeout-minutes "$WAIT_TIMEOUT_MINUTES"

      - name: Deploy (bytes-safe push + inner idle/hold recheck + restart)
        id: deploy
        if: ${{ !inputs.dry_run }}
        run: |
          scripts/deploy/ct110/run_on_ct110.sh deploy

      - name: Verify lh-harness.service is active
        if: ${{ !inputs.dry_run }}
        run: |
          state="$(scripts/deploy/ct110/run_on_ct110.sh exec systemctl is-active lh-harness.service || true)"
          echo "systemctl is-active: $state"
          if [ "$state" != "active" ]; then
            echo "::error::lh-harness.service is not active after deploy (state=$state)"
            exit 1
          fi

      - name: Verify installed lh_harness version and build commit == deploy target
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          installed="$(scripts/deploy/ct110/run_on_ct110.sh exec /home/harness/venv/bin/python -c 'import lh_harness; print(lh_harness.__version__)')"
          echo "installed version: $installed / expected: $EXPECTED_VERSION"
          if [ "$installed" != "$EXPECTED_VERSION" ]; then
            echo "::error::installed version $installed != deploy target $EXPECTED_VERSION"
            exit 1
          fi
          commit="$(scripts/deploy/ct110/run_on_ct110.sh exec /home/harness/venv/bin/python -m lh_harness.build_info)"
          echo "installed build commit: ${commit:-unknown} / expected: $EXPECTED_COMMIT"
          if [ "$commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::installed build commit ${commit:-unknown} != deploy target $EXPECTED_COMMIT"
            exit 1
          fi

      # Bounded wait, then the commit check.  Run 37162090599 (b6f51f9) called
      # /api/meta ONCE, 1.3 s after the restart, got curl exit 7 (nothing
      # listening yet) and "rolled back".  verify_meta.py polls up to 90 s in
      # 5 s steps and then requires meta.build.commit == the deployed sha, so
      # the PROCESS answering is proven to be the new code.
      - name: Verify GET /api/meta answers and runs the deployed commit (bounded wait)
        id: verify_meta
        if: ${{ !inputs.dry_run }}
        run: |
          python3 scripts/deploy/ct110/verify_meta.py \
            --url "$CT110_WEB_URL" \
            --expect-commit "$EXPECTED_COMMIT" \
            --timeout-seconds 90 \
            --interval-seconds 5

      - name: Verify drain survived the restart (task 242)
        if: ${{ !inputs.dry_run }}
        run: |
          # The new service must come back up still drained: launches stay
          # blocked until the clear step below runs, so a crash between the
          # restart and this point can never refill the slots mid-deploy.
          python3 scripts/deploy/ct110/set_drain.py \
            --url "$CT110_WEB_URL" \
            --verify-state enabled \
            --verify-attempts 3 \
            --verify-interval-seconds 10

      - name: DEPLOY OK
        if: ${{ !inputs.dry_run }}
        run: echo "CT110_DEPLOY_OK version=$EXPECTED_VERSION sha=${{ needs.preflight.outputs.sha }}"

      # Automatic rollback.  Encodes lesson 3 twice over: the rollback also
      # restarts the service, so it only runs after the deploy has actually
      # STARTED — the deploy step ran and produced an outcome (`success` or
      # `failure`; a step skipped by its `if` reports `skipped`).  A pre-deploy
      # failure (wheel download, SSH key staging, zero-active wait) must abort
      # the run with NO service restart: no window was confirmed and no deploy
      # touched the host.  A failure at or after the deploy step still rolls
      # back automatically — the service was already restarted inside a
      # confirmed window, so restoring the previous build cannot widen the
      # blast radius.
      #
      # It runs BEFORE the resume and drain-clear steps: its restart would
      # kill runs the resume step had just put back, and a cleared drain would
      # let new launches start under it.
      #
      # The inner rollback reinstalls the pre-deploy wheel BY SHA256 (copied
      # aside when the deploy started) — not "the archived wheel for version
      # X": every build is 0.1.7, so run 37162090599's rollback reinstalled
      # the new wheel and reported success.  rc=5 = the deploy never reached
      # the install step, so there is nothing to roll back.
      - name: Automatic rollback to previous version
        id: rollback
        if: ${{ failure() && !inputs.dry_run && (steps.deploy.outcome == 'success' || steps.deploy.outcome == 'failure') }}
        run: |
          set +e
          scripts/deploy/ct110/run_on_ct110.sh rollback
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "result=not_needed" >> "$GITHUB_OUTPUT"
            echo "::warning::CT110_DEPLOY_FAILED_NOTHING_INSTALLED — the deploy never reached the install step; the pre-deploy build was not touched"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            # Fixed, greppable sentinel: this is the page-worthy state.
            echo "::error::CT110_DEPLOY_ROLLBACK_FAILED rc=$rc — the pre-deploy build was NOT restored; CT110 may still run the new commit $EXPECTED_COMMIT; manual recovery required (scripts/deploy/ct110/README.md)"
            echo "CT110_DEPLOY_ROLLBACK_FAILED rc=$rc"
            exit 99
          fi
          echo "result=restored" >> "$GITHUB_OUTPUT"

      # The rollback is verified the same way as the deploy: bounded
      # /api/meta wait, then the running commit must be the pre-deploy one.
      # A pre-deploy build that predates build info (no meta.build.commit) can
      # only be proven by its wheel sha256 (checked inside CT110 by the
      # rollback itself); the report then says "commit unverified", never
      # "verified".
      - name: Verify the rollback (bounded /api/meta wait, previous commit)
        id: verify_rollback
        if: ${{ failure() && !inputs.dry_run && steps.rollback.outcome == 'success' }}
        env:
          ROLLBACK_RESULT: ${{ steps.rollback.outputs.result }}
        run: |
          set -euo pipefail
          state=/home/harness/deploy/state
          prev_commit="$(scripts/deploy/ct110/run_on_ct110.sh exec cat "$state/previous_commit" 2>/dev/null || true)"
          prev_sha="$(scripts/deploy/ct110/run_on_ct110.sh exec cat "$state/previous_wheel_sha256" 2>/dev/null || true)"
          prev_commit="$(printf '%s' "$prev_commit" | tr -d '[:space:]')"
          prev_sha="$(printf '%s' "$prev_sha" | tr -d '[:space:]')"
          set +e
          if [ "$ROLLBACK_RESULT" = "not_needed" ]; then
            python3 scripts/deploy/ct110/verify_meta.py --url "$CT110_WEB_URL" \
              --timeout-seconds 90 --interval-seconds 5
            rc=$?; status="not_needed"
          elif [ -n "$prev_commit" ]; then
            python3 scripts/deploy/ct110/verify_meta.py --url "$CT110_WEB_URL" \
              --expect-commit "$prev_commit" --timeout-seconds 90 --interval-seconds 5
            rc=$?; status="restored_verified commit=$prev_commit"
          else
            python3 scripts/deploy/ct110/verify_meta.py --url "$CT110_WEB_URL" \
              --timeout-seconds 90 --interval-seconds 5
            rc=$?; status="restored_commit_unverified wheel_sha256=${prev_sha:-unknown}"
          fi
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::CT110_DEPLOY_ROLLBACK_FAILED — rollback ran but the service did not verify ($status, verify rc=$rc); manual recovery required (scripts/deploy/ct110/README.md)"
            echo "CT110_DEPLOY_ROLLBACK_FAILED verify_rc=$rc"
            exit 99
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "rollback: $status"

      # fc-H4b (LHH-SUSPEND-TIMEOUT): parked runs come back BEFORE the
      # drain clears, on every path that suspended them — the success path
      # resumes them after verify, and a failed deploy resumes them here
      # AFTER the automatic rollback above (whose restart would otherwise
      # kill them again), so a suspend can never strand a run in a manifest.
      # Gate on "the suspend step ran" (outcome != 'skipped'), not on its
      # success: a suspend that paused some runs and then failed must still
      # put them back (the server's own bounded cleanup already does — this
      # step is the second fence and is idempotent).
      # The resume is keyed to THIS suspend's id, exported by the suspend
      # step; a stale manifest from an older suspend can never be revived.
      # If the suspend step failed before producing an id, nothing this
      # deploy paused is outstanding — notice and succeed rather than
      # resolving to whatever manifest happens to exist.
      - name: Resume suspended runs (fc-H4b)
        if: ${{ !inputs.dry_run && always() && inputs.active_runs == 'suspend' && steps.suspend_runs.outcome != 'skipped' }}
        run: |
          suspend_id="${{ steps.suspend_runs.outputs.suspend_id }}"
          if [ -z "$suspend_id" ]; then
            echo "::notice::suspend step produced no suspend id (its POST failed); nothing to resume — skipping"
            exit 0
          fi
          python3 scripts/deploy/ct110/resume_runs.py \
            --url "$CT110_WEB_URL" \
            --suspend-id "$suspend_id"

      - name: Clear drain (resume queue launches, task 242)
        if: ${{ !inputs.dry_run && always() && steps.set_drain.outcome == 'success' }}
        run: |
          # Always run once we have set the flag: the success path clears it
          # after verify, and the failure path clears it after the rollback
          # (no launches start under the rollback's restart) so a failed
          # deploy never leaves CT110 permanently drained.
          python3 scripts/deploy/ct110/set_drain.py \
            --url "$CT110_WEB_URL" \
            --disable \
            --verify-state disabled

      - name: Report rolled-back outcome
        if: ${{ failure() && !inputs.dry_run && steps.verify_rollback.outcome == 'success' }}
        env:
          ROLLBACK_STATUS: ${{ steps.verify_rollback.outputs.status }}
        run: |
          case "$ROLLBACK_STATUS" in
            restored_verified*)
              echo "::warning::CT110_DEPLOY_FAILED_ROLLBACK_OK — $ROLLBACK_STATUS (the running service reports the pre-deploy commit)" ;;
            restored_commit_unverified*)
              echo "::warning::CT110_DEPLOY_FAILED_ROLLBACK_COMMIT_UNVERIFIED — $ROLLBACK_STATUS: the pre-deploy wheel bytes were reinstalled and the service answers, but that build predates build info, so /api/meta cannot confirm its commit" ;;
            not_needed*)
              echo "::warning::CT110_DEPLOY_FAILED_NOTHING_INSTALLED — the deploy never reached the install step; the pre-deploy build is still running" ;;
          esac
          echo "CT110_DEPLOY_FAILED rollback=$ROLLBACK_STATUS"
          exit 1

      - name: Deployment record
        if: ${{ always() }}
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome || 'not-run' }}
          ROLLBACK_STATUS: ${{ steps.verify_rollback.outputs.status || 'n/a' }}
          META_COMMIT: ${{ steps.verify_meta.outputs.commit || 'not read' }}
        run: |
          {
            echo "## CT110 deploy — $(date -u +%FT%TZ)"
            echo
            echo "- target node: \`$TARGET_NODE\` (CT $CT_ID)"
            echo "- target_ref: \`${{ inputs.target_ref }}\`"
            echo "- resolved sha: \`${{ needs.preflight.outputs.sha }}\`"
            echo "- expected version: \`$EXPECTED_VERSION\`"
            echo "- dry_run: ${{ inputs.dry_run }}"
            echo "- expected commit: \`$EXPECTED_COMMIT\` / /api/meta reported: \`$META_COMMIT\`"
            echo "- deploy step: $DEPLOY_OUTCOME / rollback step: $ROLLBACK_OUTCOME ($ROLLBACK_STATUS)"
          } >> "$GITHUB_STEP_SUMMARY"

  # TASK 236: ship the overseer-sweep systemd units to CT110 as part of the
  # SAME pipeline (no parallel ad-hoc deploy path).  The stage transfers the
  # two unit files + ct110_units.sh through the same bytes-verified hops and
  # runs ct110_deploy.sh mode "units" inside CT110.  The stage installs the
  # units and NEVER enables or starts them (and never touches
  # LH_OVERSEER_TICK_MODE): enabling the timer and flipping the tick to act
  # mode are documented operator steps (docs/OVERSEER-TICK-CT110.md section
  # 5) that require the 24h read-only comparison first.  A dry_run deploy
  # skips this stage like every other host-touching step.
  # CT110 ONLY: the overseer sweep is not installed on ct111 (nodes.json
  # `overseerUnits: false`), so the whole job is skipped for that target and
  # its `environment: ct110-prod` below stays a literal.
  overseer-units:
    name: Ship overseer-sweep systemd units (install only, never enabled)
    needs: [preflight, deploy]
    if: ${{ !inputs.dry_run && needs.deploy.result == 'success' && inputs.target != 'ct111' }}
    runs-on: [self-hosted, lan-deploy]
    environment: ct110-prod
    timeout-minutes: 15
    # run_on_ct110.sh needs PVE_HOST / PVE_USER / CT_ID / SSH_KEY_FILE. Since the
    # ct111 change (93946f4) those live on the deploy job only, so this job failed
    # with "set PVE_HOST" (run 36923728646). It is CT110-only, so it reads the CT110
    # names directly; distinct UNITS_* keys keep the deploy job's per-target lines
    # unique, and the stage step below exports the names the script expects.
    env:
      UNITS_PVE_SSH_KEY: ${{ secrets.CT110_PVE_SSH_KEY }}
      UNITS_PVE_HOST: ${{ vars.CT110_PVE_HOST || 'corsairai300' }}
      UNITS_PVE_USER: ${{ vars.CT110_PVE_SSH_USER || 'root' }}
      UNITS_CT_ID: ${{ vars.CT110_CT_ID || '110' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Stage SSH key and CT110 connection facts
        run: |
          set -euo pipefail
          [ -n "$UNITS_PVE_SSH_KEY" ] || { echo "::error::secret CT110_PVE_SSH_KEY is not set in environment ct110-prod"; exit 1; }
          key_file="$RUNNER_TEMP/ct110_pve_key"
          install -m 600 /dev/null "$key_file"
          printf '%s\n' "$UNITS_PVE_SSH_KEY" > "$key_file"
          {
            echo "SSH_KEY_FILE=$key_file"
            echo "PVE_HOST=$UNITS_PVE_HOST"
            echo "PVE_USER=$UNITS_PVE_USER"
            echo "CT_ID=$UNITS_CT_ID"
          } >> "$GITHUB_ENV"
          echo "pve_host=$UNITS_PVE_HOST pve_user=$UNITS_PVE_USER ct_id=$UNITS_CT_ID"

      - name: Stage unit files
        run: |
          set -euo pipefail
          mkdir -p stage/units
          cp packaging/lh-overseer-sweep.service stage/units/
          cp packaging/lh-overseer-sweep.timer  stage/units/
          # The tick entrypoint + telemetry module install under
          # /home/harness/.overseer-sweep/bin/ (self-contained; see
          # ct110_units.sh), so they travel with the units.
          cp scripts/overseer_ct110/tick.sh        stage/units/
          cp scripts/overseer_ct110/tick_notify.py stage/units/
          # run_on_ct110.sh stages ct110_units.sh (its sibling) itself; this
          # job only stages the unit payloads above.
          test -f scripts/deploy/ct110/ct110_units.sh
          test -f scripts/deploy/ct110/ct110_deploy.sh
          ls -l stage/units

      - name: Install units inside CT110 (install-only; nothing enabled)
        run: |
          scripts/deploy/ct110/run_on_ct110.sh units

      - name: Verify the units are installed but NOT enabled
        run: |
          set -euo pipefail
          for unit in lh-overseer-sweep.service lh-overseer-sweep.timer; do
            installed="$(scripts/deploy/ct110/run_on_ct110.sh exec test -f /etc/systemd/system/$unit && echo yes || echo no)"
            echo "$unit installed: $installed"
            if [ "$installed" != "yes" ]; then
              echo "::error::$unit is not installed on CT110 after the units stage"
              exit 1
            fi
          done
          installed_tick="$(scripts/deploy/ct110/run_on_ct110.sh exec test -x /home/harness/.overseer-sweep/bin/tick.sh && echo yes || echo no)"
          echo "tick entrypoint installed: $installed_tick"
          if [ "$installed_tick" != "yes" ]; then
            echo "::error::tick entrypoint is not installed at /home/harness/.overseer-sweep/bin/tick.sh"
            exit 1
          fi
          # Enablement must remain untouched by the pipeline: an enabled
          # timer that appeared as a deploy side effect would start ticking
          # without the operator's 24h read-only comparison.
          for unit in lh-overseer-sweep.timer; do
            state="$(scripts/deploy/ct110/run_on_ct110.sh exec systemctl is-enabled $unit || true)"
            echo "$unit is-enabled: ${state:-not-enabled}"
            if [ "$state" = "enabled" ]; then
              echo "::error::$unit is ENABLED after the units stage — the pipeline must never enable it (operator step only)"
              exit 1
            fi
          done
          echo "CT110_UNITS_SHIP_OK (installed, not enabled)"

      - name: Overseer units record
        if: ${{ always() }}
        run: |
          {
            echo "## CT110 overseer-sweep units — $(date -u +%FT%TZ)"
            echo
            echo "- resolved sha: \`${{ needs.preflight.outputs.sha }}\`"
            echo "- units staged and shipped through the 224 bytes-verified hops"
            echo "- install-only: timer NOT enabled, tick mode NOT touched (operator rollout step)"
          } >> "$GITHUB_STEP_SUMMARY"
