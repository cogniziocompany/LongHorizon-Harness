name: Claude Code PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-pr-${{ github.event.issue.number || github.event.pull_request.number || github.event.pull_request_review.pull_request_url }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: |
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    # Real wall-clock cap, at the JOB level - this is the mechanism that actually
    # works. The action input named timeout_minutes (removed above) never applied.
    # Matters because concurrency below sets cancel-in-progress: false, so a hung
    # job would block every later @claude mention on the PR until the runner's
    # 6-hour default finally fired.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 - a depth-1 clone contains ONLY the PR head commit, so the
          # reviewer cannot see main. On 2026-09-09 that made it report that a real
          # commit "does not exist" and that symbols present on main appeared nowhere,
          # accusing correct work of being fabricated. Full history is what lets a
          # cross-branch claim be checked before it is made.
          fetch-depth: 0

      - name: Run Claude Code in tag mode
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # timeout_minutes removed: claude-code-action@v1 does not accept it and emits
          # "Unexpected input(s) 'timeout_minutes'". The 15-minute limit it appeared to
          # set was never in effect.
